# Do not start an HTTP server — this is a cron batch job
spring.main.web-application-type=none

# Active profile: override with -Dspring.profiles.active=qa or export SPRING_PROFILES_ACTIVE=qa
spring.profiles.active=dev

# Logging
logging.level.root=INFO
logging.level.com.dams.messageparsing=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n

# Suppress Spring Boot startup banner in batch output
spring.main.banner-mode=off
